version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: "/employee-dashboard"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/employee-dashboard"
    schedule:
      interval: weekly
